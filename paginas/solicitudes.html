<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis solicitudes — Hogaru</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="stylesheet" href="../estilos.css">
</head>
<body data-raiz="../">
  <div id="navbar"></div>
  <main class="contenedor">
    <!-- Tarjeta de Perfil de Usuario -->
    <div class="panel fila-entre" id="tarjeta-perfil-solicitudes" style="margin-bottom:18px; align-items:center;">
      <div class="fila" style="gap:16px; align-items:center;">
        <div id="avatar-perfil-solicitudes"></div>
        <div>
          <h2 style="margin:0; font-size:1.25rem;" id="nombre-perfil-solicitudes"></h2>
          <p class="muted" style="margin:2px 0 0; font-size:0.88rem;" id="info-perfil-solicitudes"></p>
        </div>
      </div>
      <button type="button" class="btn btn-claro btn-chico" id="btn-cambiar-foto-solicitudes">
        📷 Cambiar foto de perfil
      </button>
    </div>

    <h1 id="titulo">Solicitudes</h1>
    <p class="muted" id="subtitulo"></p>
    <div class="chips" style="justify-content:flex-start" id="filtros"></div>
    <div id="aviso" class="oculto"></div>
    <div class="panel"><div class="tabla-envoltorio" id="tabla"><p class="muted">Cargando…</p></div></div>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/solicitudes.js"></script>
</body>
</html>
